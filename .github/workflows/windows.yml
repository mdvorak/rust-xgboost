name: Windows

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Builds libxgboost from the pinned submodule, like every other platform's
    # workflow. release-libs.yml already proves the cmake build itself works
    # under MSVC; what was never exercised is the `local_build` path through
    # build.rs, which is a different invocation (cmake crate, an install step,
    # extra -D defines, and a `static=dmlc` link). Running it here is what makes
    # CI independent of the prebuilt release assets.
    #
    # Ninja is deliberately not installed: build.rs picks it up from PATH if
    # present, and the generator proven on Windows is the Visual Studio one that
    # release-libs.yml uses.
    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
      
